    # Unstop queries alone returned ~329 items and produced ONE selection.
    # Google News queries were tried before and removed because they returned
    # retrospective coverage ("Summit concludes...", exam recaps) with no
    # forward date and no registration link. The queries below are therefore
    # filtered on TENSE, not topic: every one is built around forward-looking
    # language ("applications open", "registrations open", "apply by", "to be
    # held", "early bird") and explicitly excludes retrospective words. That is
    # the difference from the version that failed. build_digest.py's
    # `_opportunity_is_past` + `extract_event_date` still drop anything whose
    # date has already gone, so a retrospective slipping through is caught.
    feeds:
      - https://news.google.com/rss/search?q=(%22Jaipur+Literature+Festival%22+OR+JLF+OR+%22Magnetic+Fields%22+OR+%22NH7+Weekender%22+OR+%22India+Art+Fair%22+OR+%22Venice+Biennale%22+OR+%22Art+Basel%22)+when:30d&hl=en-IN&gl=IN&ceid=IN:en  # [GNEWS] discovery-only — NEVER authoritative on dates
      # Fellowships / cohorts / accelerators / grants — India, forward-dated only.
      - https://news.google.com/rss/search?q=(%22applications+open%22+OR+%22call+for+applications%22+OR+%22apply+by%22+OR+%22last+date+to+apply%22+OR+%22applications+invited%22)+(fellowship+OR+cohort+OR+accelerator+OR+incubator+OR+residency+OR+grant+OR+scholarship)+India+-concludes+-concluded+-recap+-highlights+when:21d&hl=en-IN&gl=IN&ceid=IN:en  # [GNEWS] forward-dated
      # Conferences / summits / expos — India, forward-dated only.
      # trimmed 24 Sep 2026 (returned foreign festivals/retrospectives; structured boards cover events): https://news.google.com/rss/search?q=(%22registrations+open%22+OR+%22registration+is+open%
      # AI / deep-tech specific, India — the reader's actual domain.
      - https://news.google.com/rss/search?q=(%22applications+open%22+OR+%22registrations+open%22+OR+%22call+for+papers%22+OR+%22apply+by%22)+(AI+OR+%22deep+tech%22+OR+robotics+OR+semiconductor+OR+quantum+OR+climate+OR+space)+(summit+OR+conference+OR+fellowship+OR+hackathon+OR+challenge)+India+-concluded+-recap+when:21d&hl=en-IN&gl=IN&ceid=IN:en  # [GNEWS] forward-dated
      # Global — only the creamiest; no India filter, so keep the bar high.
      # trimmed 24 Sep 2026 (global fellowship query returned NGO/Africa listings, 0-4% picked): https://news.google.com/rss/search?q=(%22applications+open%22+OR+%22call+for+applications%

  - name: "Beyond Your Beat"
    slug: beyond-your-beat
    max_stories: 3
    angle: "Broad top headlines so the editor can surface 1-3 genuinely important stories OUTSIDE the reader's usual domains (major sports, culture, world moments) that he'd regret missing. Not for stories already covered in other sections."
    feeds:
