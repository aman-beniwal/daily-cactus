name: Watchdog — did today's paper publish?

# v7: on 21 Sep 2026 the WRITE routine never ran, no paper appeared, and
# nothing said so. This checks gh-pages every afternoon and opens a health
# issue (GitHub emails the owner) when today's edition is missing.
on:
  schedule:
    # v9: GitHub starts scheduled jobs 3-5 h late on this repo (Sep-Oct 2026:
    # 14:13 ran at 19:00-22:30 IST). 11:13 IST lands ~14:00-16:00 in practice,
    # after the newsroom's 10:30 retry deadline. Newsroom failures already open
    # their own issue at once; this is the backstop for 'nothing ran at all'.
    - cron: '43 5 * * *'     # 11:13 IST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Look for today's edition
        id: look
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ -f "editions/$TODAY.json" ]; then echo "missing=0" >> "$GITHUB_OUTPUT"; else echo "missing=1" >> "$GITHUB_OUTPUT"; fi

      - name: Open a health issue
        if: steps.look.outputs.missing == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const d = '${{ steps.look.outputs.today }}';
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Daily Cactus: no edition for ${d}`,
              labels: ['health'],
              body: [
                `No editions/${d}.json on gh-pages yet.`,
                '',
                'Check, in order:',
                '1. Actions -> "Fetch RSS Feeds" ran today?',
                '2. Actions -> "Newsroom — select & write" ran, and is it still waiting for a usage-limit reset?',
                '3. Any open "ALERT" / "newsroom failed" issue for today says why.',
                'To publish now: Actions -> Newsroom -> Run workflow (date blank).',
              ].join('\n'),
            });
